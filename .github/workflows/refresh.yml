name: refresh
on:
  # 定时任务暂停：当前列表为人工验片源，恢复前请勿开启
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -q websockets

      - name: fetch + build
        env:
          CI: "true"
          CHROME_BIN: /usr/bin/google-chrome
        run: |
          python3 refresh.py --fresh
          VERIFY=1 python3 build.py

      - name: publish to data branch
        run: |
          set -e
          n=$(python3 -c "import json;print(sum(1 for r in json.load(open('results.json')) if r.get('ok')))")
          echo "playable: $n"
          if [ "$n" -lt 20 ]; then echo "too few results, abort"; exit 1; fi
          rm -rf /tmp/pub && mkdir -p /tmp/pub && cd /tmp/pub
          cp "$GITHUB_WORKSPACE/playlist.m3u" .
          git init -q
          git config user.name  "feed-bot"
          git config user.email "feed-bot@users.noreply.github.com"
          git add playlist.m3u
          git commit -q -m "refresh $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:data
